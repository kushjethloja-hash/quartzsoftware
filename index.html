const sha256 = (() => {
  const K = [], H0 = [];
  const isPrime = x => { for(let i = 2; i * i <= x; i++) if(x % i === 0) return false; return true; };
  for(let n = 2; K.length < 64; n++){
    if(!isPrime(n)) continue;
    if(H0.length < 8) H0.push((Math.pow(n, 1/2) % 1) * 4294967296 | 0);
    K.push((Math.pow(n, 1/3) % 1) * 4294967296 | 0);
  }
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  return msg => {
    const bytes = new TextEncoder().encode(msg), l = bytes.length;
    const total = ((l + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l * 8 / 4294967296));
    const h = H0.slice(), w = new Array(64);
    for(let i = 0; i < total; i += 64){
      for(let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
      for(let t = 16; t < 64; t++){
        const s0 = rotr(w[t-15], 7) ^ rotr(w[t-15], 18) ^ (w[t-15] >>> 3);
        const s1 = rotr(w[t-2], 17) ^ rotr(w[t-2], 19) ^ (w[t-2] >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for(let t = 0; t < 64; t++){
        const t1 = (hh + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + w[t]) | 0;
        const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, hh].forEach((v, j) => h[j] = (h[j] + v) | 0);
    }
    return h.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
  };
})();

  const timer = setTimeout(() => ctl.abort(), NET_TIMEOUT);
  try {
    const r = await fetch(url, Object.assign({}, opts, {signal: ctl.signal}));
    const txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch(e){}
    if(!r.ok){
      const er = j && j.error || {};
      const x = new Error(er.message || ("HTTP " + r.status));
      x.code = "http"; x.status = r.status; x.msg = er.message || ""; x.fstatus = er.status || "";
      throw x;
    }
    return j;
  } catch(e){
    if(e.code === "http") throw e;
    const x = new Error(e.name === "AbortError" ? "timeout" : "network");
    x.code = x.message;
    throw x;
  } finally { clearTimeout(timer); }
}
async function authCall(kind, email, pw){
  const j = await jfetch(`https://identitytoolkit.googleapis.com/v1/accounts:${kind}?key=${FIREBASE_CONFIG.apiKey}`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({email, password: pw, returnSecureToken: true})});
  idToken = j.idToken; refreshTok = j.refreshToken;
  tokenExp = Date.now() + (parseInt(j.expiresIn, 10) || 3600) * 1000;
  return j.localId;
}
async function token(){
  if(Date.now() < tokenExp - 60000) return idToken;
  const j = await jfetch(`https://securetoken.googleapis.com/v1/token?key=${FIREBASE_CONFIG.apiKey}`, {
    method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(refreshTok)});
  idToken = j.id_token; refreshTok = j.refresh_token;
  tokenExp = Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000;
  return idToken;
}
async function fsReq(method, url, body){
  const tk = await token();
  return jfetch(url, {method, headers: {"Authorization": "Bearer " + tk, "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
}
const parseDoc = j => ({
  salt: j.fields && j.fields.salt && j.fields.salt.stringValue || "",
  pin: j.fields && j.fields.pin && j.fields.pin.stringValue || "",
  data: j.fields && j.fields.data && j.fields.data.stringValue || "",
  updateTime: j.updateTime || ""
});
const newDocFields = (salt, pin, data) => ({fields: {salt: {stringValue: salt}, pin: {stringValue: pin}, data: {stringValue: data}}});
async function docGet(){
  try { return parseDoc(await fsReq("GET", `${FS_ROOT}/${encodeURIComponent(uidFb)}`)); }
  catch(e){
    if(e.code === "http" && e.status === 404 && !/database[^.]*does not exist/i.test(e.msg)) return null;   // document not created yet
    throw e;
  }
}
const isConflict = e => e && e.code === "http" && (e.status === 409 || /FAILED_PRECONDITION|ABORTED/.test(e.fstatus));

// ---- Cloud save (version check: so newer data from another phone is not overwritten) ----
let saving = false, dirty = false;
function cloudQueue(){ dirty = true; if(!saving) flush(); }
async function flush(){
  if(!uidFb || !acct) return;
  saving = true;
  while(dirty){
    dirty = false;
    setSync("⏳ Saving…");
    try {
      const j = await fsReq("PATCH",
        `${FS_ROOT}/${encodeURIComponent(uidFb)}?currentDocument.updateTime=${encodeURIComponent(baseTime)}&updateMask.fieldPaths=data`,
        {fields: {data: {stringValue: JSON.stringify(db)}}});
      baseTime = j.updateTime; unsaved = false;
      setSync("☁️ Saved ✔");
    } catch(e){
      if(isConflict(e)){
        try {
          const d = await docGet();
          db = JSON.parse(d.data); baseTime = d.updateTime; unsaved = false;
          if(!Array.isArray(db.history)) db.history = [];
          setSync("🔄 Newer data from another device loaded");
          alert("Newer data was saved from another device, so the screen has been refreshed with it. Please redo your latest entry or change.");
          render();
        } catch(e2){ unsaved = true; setSync("⚠️ Not saved. Tap here to try again.", true); }
      } else {
        unsaved = true;
        setSync("⚠️ Not saved: " + authError(e).split(". ")[0] + ". Tap here to try again.", true);
      }
      break;
    }
  }
  saving = false;
}

async function loadAccount(){
  let d = await docGet();
  if(!d){      // signup beech me ruka ho to default account bana do
    const salt = uid() + uid();
    d = parseDoc(await fsReq("POST", `${FS_ROOT}?documentId=${encodeURIComponent(uidFb)}`,
      newDocFields(salt, hashPw(salt, "pin:4291"), JSON.stringify({models: [], history: []}))));
  }
  acct = {salt: d.salt, pin: d.pin};
  baseTime = d.updateTime;
  try { db = JSON.parse(d.data); } catch(e){ db = {models: [], history: []}; }
  if(!db || !Array.isArray(db.models)) db = {models: [], history: []};
  if(!Array.isArray(db.history)) db.history = [];
}
async function startSession(){
  loading = true; migrate(); loading = false;
  view = {page: "models"};
  render();
  setSync("");
}
function resetSession(){
  user = null; uidFb = null; acct = null; baseTime = ""; unsaved = false; authMode = "login";
  idToken = ""; refreshTok = ""; tokenExp = 0;
  db = {models: [], history: []};
  setSync("");
  render();
}

// Delete Password is asked before any delete (set at signup; 4291 if left blank)
function askPass(){
  const p = prompt("Enter the Delete Password to continue:");
  if(p === null) return false;
  if(!acct || hashPw(acct.salt, "pin:" + p.trim()) !== acct.pin){ alert("❌ Wrong password. Nothing was deleted."); return false; }
  return true;
}

function authError(e){
  const m = String(e && e.msg || ""), c = e && e.code;
  if(c === "timeout") return "The server did not respond. Check your internet and try again.";
  if(c === "network") return "Could not reach the server. Check your internet. If the internet is fine, the browser may be blocking this file; in that case open the file from an online link.";
  if(/EMAIL_EXISTS/.test(m)) return "This username already exists. Please choose another one.";
  if(/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return "Wrong username or password.";
  if(/TOO_MANY_ATTEMPTS/.test(m)) return "Too many failed attempts. Please try again after a while.";
  if(/OPERATION_NOT_ALLOWED|CONFIGURATION_NOT_FOUND/.test(m)) return "Email/Password sign-in is not enabled in Firebase. Enable Email/Password under Authentication.";
  if(/WEAK_PASSWORD/.test(m)) return "Password must be at least 6 characters.";
  if(/API key not valid|API_KEY|API key/i.test(m)) return "The API key is invalid. Is the Firebase config set correctly in the file?";
  if(/database[^.]*does not exist/i.test(m) && e.status === 404) return "Firestore Database has not been created. In Firebase go to Firestore Database > Create database.";
  if(/SERVICE_DISABLED|has not been used|is disabled/i.test(m)) return "Firestore is not enabled. In Firebase go to Firestore Database > Create database.";
  if(e && (e.status === 403 || /PERMISSION_DENIED/.test(e.fstatus || ""))) return "The database denied access. Have the Firestore Rules been published correctly?.";
  return "Something went wrong: " + (m || (e && e.message) || e);
}

// ---- Saved login (username + password remembered on this device) ----
function getSavedLogin(){ try { const j = JSON.parse(localStorage.getItem("bizSavedLogin") || "null"); return (j && j.u) ? j : null; } catch(e){ return null; } }
function saveLogin(u, pw){ try { localStorage.setItem("bizSavedLogin", JSON.stringify({u, p: pw})); } catch(e){} }
function forgetLogin(){ try { localStorage.removeItem("bizSavedLogin"); } catch(e){} }

function renderLogin(){
  const L = authMode === "login";
  title.onclick = null; title.style.cursor = "";
  title.textContent = L ? "Login" : "New Account";
  const warn = CONFIGURED ? "" : `<div class="setup">⚙️ <b>Setup pending.</b> Firebase config has not been added to this file yet, so login will not work.</div>`;
  app.innerHTML = warn + `<div class="card">
    <label>Username</label><input id="lu" autocapitalize="none" autocomplete="username">
    <label>Password</label><input id="lp" type="password" autocomplete="${L ? "current-password" : "new-password"}">
    ${L ? "" : `<label>Confirm Password</label><input id="lp2" type="password" autocomplete="new-password">
    <label>Delete Password</label><input id="lpin" type="password" inputmode="numeric">`}
    <div style="height:14px"></div>
    <button class="btn" id="go">${L ? "Login" : "Create Account"}</button>
    <div style="height:8px"></div>
    <button class="btn ghost" id="sw">${L ? "➕ Create New Account" : "← Back to Login"}</button>
    ${L && getSavedLogin() ? `<div style="height:8px"></div><button class="btn ghost" id="forget">🗑️ Forget saved login</button><div class="sub">Username and password are saved on this phone. To change them, just type new ones and tap Login.</div>` : ""}
  </div>`;
  if(L){
    const sv = getSavedLogin();
    if(sv){ document.getElementById("lu").value = sv.u; document.getElementById("lp").value = sv.p || ""; }
    const fg = document.getElementById("forget");
    if(fg) fg.onclick = () => { if(confirm("Remove the saved username and password from this phone?")){ forgetLogin(); renderLogin(); } };
  }
  const go = document.getElementById("go");
  app.querySelectorAll("input").forEach(el => el.onkeydown = e => { if(e.key === "Enter") go.click(); });
  document.getElementById("sw").onclick = () => { authMode = L ? "signup" : "login"; renderLogin(); };

  go.onclick = async () => {
    if(!CONFIGURED){ alert("Firebase setup is pending."); return; }
    const u = document.getElementById("lu").value.trim().toLowerCase();
    const pw = document.getElementById("lp").value;
    if(!L && (!u || !pw || !document.getElementById("lp2").value || !document.getElementById("lpin").value.trim())){ alert("Please fill in all the details."); return; }
    if(!/^[a-z0-9._-]{3,30}$/.test(u)){ alert("Username must be 3 to 30 characters: only English letters, numbers, . _ - are allowed."); return; }
    if(pw.length < 6){ alert("Password must be at least 6 characters."); return; }
    let pin = "4291", initial = {models: [], history: []};
    if(!L){
      if(pw !== document.getElementById("lp2").value){ alert("The two passwords do not match."); return; }
      pin = document.getElementById("lpin").value.trim();
    }
    go.disabled = true;
    try {
      go.textContent = "Please wait…";
      uidFb = await authCall(L ? "signInWithPassword" : "signUp", toEmail(u), pw);
      if(!L){
        go.textContent = "Please wait…";
        const salt = uid() + uid();
        await fsReq("POST", `${FS_ROOT}?documentId=${encodeURIComponent(uidFb)}`, newDocFields(salt, hashPw(salt, "pin:" + pin), JSON.stringify(initial)));
      }
      go.textContent = "Please wait…";
      await loadAccount();
      user = u;
      saveLogin(u, pw);
      startSession();
    } catch(e){
      const partial = !L && uidFb;
      uidFb = null; idToken = ""; refreshTok = "";
      alert(authError(e) + (partial ? "\n\nThe account has already been created. Tap 'Back to Login' and log in with the same username and password." : ""));
      go.disabled = false; go.textContent = L ? "Login" : "Create Account";
    }
  };
}

const validBackup = b => b && b.app === "bizapp" && b.data && Array.isArray(b.data.models);
function parseBackup(text){
  try {
    let t = text.trim();
    if(t[0] !== "{"){
      const m = t.match(/<script id="bizEmbedded" type="application\/json">([\s\S]*?)<\/script>/);
      if(!m) return null;
      t = m[1];
    }
    const b = JSON.parse(t);
    return validBackup(b) ? b : null;
  } catch(e){ return null; }
}

function bindAccountCard(){
  document.getElementById("logout").onclick = () => {
    if(saving){ alert("Saving is in progress. Please wait 2 seconds and then log out."); return; }
    if(unsaved && !confirm("Some changes have not been saved to the cloud. Log out anyway?")) return;
    resetSession();
  };
  document.getElementById("refresh").onclick = async () => {
    if(saving || dirty || unsaved){ alert("Please let the save finish first."); return; }
    try { setSync("⏳ Loading from cloud…"); await loadAccount(); render(); setSync("☁️ Latest data loaded"); }
    catch(e){ setSync("⚠️ Could not load from cloud.", true); }
  };
  document.getElementById("chgPw").onclick = async () => {
    if(saving || dirty || unsaved){ alert("Please let the save finish first."); return; }
    const oldPw = prompt("Enter your old password:");
    if(oldPw === null) return;
    const n1 = prompt("Enter your new password (at least 6 characters):");
    if(n1 === null) return;
    if(n1.length < 6){ alert("Password must be at least 6 characters."); return; }
    const n2 = prompt("Enter the new password again:");
    if(n2 === null) return;
    if(n1 !== n2){ alert("The two passwords do not match."); return; }
    try {
      await authCall("signInWithPassword", toEmail(user), oldPw);     // verifies the old password
    } catch(e){
      if(e.code === "http"){ alert("❌ Old password is wrong."); return; }
      alert(authError(e)); return;
    }
    try {
      const j = await jfetch(`https://identitytoolkit.googleapis.com/v1/accounts:update?key=${FIREBASE_CONFIG.apiKey}`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({idToken, password: n1, returnSecureToken: true})});
      if(j.idToken){
        idToken = j.idToken; refreshTok = j.refreshToken || refreshTok;
        tokenExp = Date.now() + (parseInt(j.expiresIn, 10) || 3600) * 1000;
      }
      if(getSavedLogin()) saveLogin(user, n1);
      alert("✅ Password changed. Use the new password next time you log in.");
    } catch(e){ alert(authError(e)); }
  };
  document.getElementById("chgPin").onclick = async () => {
    if(saving || dirty || unsaved){ alert("Please let the save finish first."); return; }
    const cur = prompt("Enter the current Delete Password:");
    if(cur === null) return;
    if(hashPw(acct.salt, "pin:" + cur.trim()) !== acct.pin){ alert("❌ Wrong password."); return; }
    const n1 = prompt("Enter the new Delete Password:");
    if(n1 === null) return;
    if(!n1.trim()){ alert("Delete Password cannot be empty."); return; }
    const n2 = prompt("Enter the new Delete Password again:");
    if(n2 === null) return;
    if(n1.trim() !== n2.trim()){ alert("The two passwords do not match."); return; }
    try {
      const np = hashPw(acct.salt, "pin:" + n1.trim());
      const j = await fsReq("PATCH", `${FS_ROOT}/${encodeURIComponent(uidFb)}?updateMask.fieldPaths=pin`, {fields: {pin: {stringValue: np}}});
      acct.pin = np; baseTime = j.updateTime;
      alert("✅ Delete Password changed. It will now be asked for every delete.");
    } catch(e){ alert(authError(e)); }
  };
  const f = document.getElementById("impFile");
  document.getElementById("impBtn").onclick = () => f.click();
  f.onchange = () => {
    const file = f.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const b = parseBackup(String(rd.result));
      if(!b){ alert("This is not a valid backup file."); return; }
      if(!confirm("Replace this account's current data with the data from this file?")) return;
      db = b.data;
      if(!Array.isArray(db.history)) db.history = [];
      loading = true; migrate(); loading = false;
      log("Imported data from an old backup file");
      view = {page: "models"}; render();
    };
    rd.readAsText(file);
  };
}

      ${entryRows(r.entries, true)}
      <div class="bal tot"><small>Total Fitting</small><strong>${rs(paid(r))}</strong></div>
    </div>
    ${olderHtml}`;

  if(showForm){
    const fi = document.getElementById("fitting"), co = document.getElementById("color"), mo = document.getElementById("molding");
    const others = paid(r) - (editing ? num(editing.fitting) : 0);
    const calc = () => {
      const b = num(co.value) - others - (fi ? num(fi.value) : 0);
      const box = document.getElementById("bal");
      box.className = "bal" + (b === 0 ? "" : " due");
      box.innerHTML = `<small>Balance</small><strong>${rs(b)}</strong>`;
    };
    [fi, co, mo].forEach(el => { if(el) el.oninput = calc; });
    calc();
    if(!editMC){
      const t = editing ? editing.t : Date.now();
      document.getElementById("dt").innerHTML = `📅 Date: <b>${fdate(t)}</b> &nbsp; 🕒 Time: <b>${ftime(t)}</b>`;
    }

    document.getElementById("save").onclick = () => {
      const mv = mo.value, cv = co.value;
      if(editMC){
        if(mv === "" || cv === ""){ alert("Enter Molding and Color."); return; }
        if(num(cv) < paid(r)){ alert("Color cannot be less than the Fitting paid so far."); return; }
        r.molding = mv; r.color = cv;
        log(`Molding/Color edit: ${c.name} — Molding ${rs(num(mv))}, Color ${rs(num(cv))}, Balance ${rs(total(r))}`);
        view = {page: "client", mid: m.id, cid: c.id}; render(); window.scrollTo({top: 0, behavior: "smooth"});
        return;
      }
      const f = fi.value;
      if(!locked && (mv === "" || cv === "")){ alert("Please enter Molding and Color first."); return; }
      if(f === ""){ alert("Enter Fitting."); return; }
      if(locked && num(f) <= 0){ alert("Fitting must be greater than 0."); return; }
      if(num(cv) - others - num(f) < 0){ alert("Fitting is more than the balance. Balance cannot go negative."); return; }
      if(!locked){ r.molding = mv; r.color = cv; }
      if(editing){
        editing.fitting = f;
        log(`Entry edit: ${c.name} — ${fdate(editing.t)} ${ftime(editing.t)} — Fitting ${rs(num(f))}, Balance ${rs(total(r))}`);
      } else {
        r.entries.unshift({id: uid(), t: Date.now(), fitting: f});
        log(`Save: ${c.name} — Molding ${rs(num(r.molding))}, Color ${rs(num(r.color))}, Fitting ${rs(num(f))}, Balance ${rs(total(r))}`);
      }
      view = {page: "client", mid: m.id, cid: c.id};
      render();
      window.scrollTo({top: 0, behavior: "smooth"});
    };
    const cancel = document.getElementById("cancel");
    if(cancel) cancel.onclick = () => { view = {page: "client", mid: m.id, cid: c.id}; render(); };
  }

  app.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => {
    view = {page: "client", mid: m.id, cid: c.id, mc: true};
    render(); window.scrollTo({top: 0, behavior: "smooth"});
  });
  const nr = document.getElementById("newRound");
  if(nr) nr.onclick = () => {
    c.rounds.unshift({id: uid(), molding: "", color: "", entries: []});
    log(`New Molding/Color started: ${c.name}`);
    view = {page: "client", mid: m.id, cid: c.id}; render(); window.scrollTo({top: 0, behavior: "smooth"});
  };
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    view = {page: "client", mid: m.id, cid: c.id, eid: b.dataset.edit};
    render(); window.scrollTo({top: 0, behavior: "smooth"});
  });
  app.querySelectorAll("[data-delround]").forEach(b => b.onclick = () => {
    const o = c.rounds.find(x => x.id === b.dataset.delround);
    if(!o || o === c.rounds[0]) return;
    if(askPass() && confirm("Delete this entire old account?")){
      c.rounds = c.rounds.filter(x => x.id !== o.id);
      log(`Old account deleted: ${c.name} — Molding ${rs(num(o.molding))}, Color ${rs(num(o.color))}, Fitting ${rs(paid(o))}`);
      view = {page: "client", mid: m.id, cid: c.id};
      render();
    }
  });
  app.querySelectorAll("[data-delent]").forEach(b => b.onclick = () => {
    const e = r.entries.find(x => x.id === b.dataset.delent);
    if(askPass() && confirm(`Delete the entry of ${fdate(e.t)} ${ftime(e.t)}?`)){
      r.entries = r.entries.filter(x => x.id !== e.id);
      log(`Entry delete: ${c.name} — ${fdate(e.t)} ${ftime(e.t)}, Fitting ${rs(num(e.fitting))}`);
      view = {page: "client", mid: m.id, cid: c.id};
      render();
    }
  });
}

// Only this client's entries (all Molding/Color accounts) are downloaded as Excel (.xls)
function exportExcel(m, c){
  const rounds = c.rounds.filter(r => r.entries.length).reverse();
  if(!rounds.length){ alert("This client has no entries yet."); return; }
  const td = v => `<td>${v}</td>`;
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>
<table border="1">
<tr><td><b>Model</b></td><td colspan="3">${esc(m.name)}</td></tr>
<tr><td><b>Client</b></td><td colspan="3">${esc(c.name)}</td></tr>`;
  rounds.forEach((r, i) => {
    html += `<tr><td colspan="4"></td></tr>
<tr><td><b>Molding</b></td><td colspan="3">${num(r.molding)}</td></tr>
<tr><td><b>Color</b></td><td colspan="3">${num(r.color)}</td></tr>
<tr style="background:#dbe4ff;font-weight:bold"><td>Date</td><td>Time</td><td>Fitting</td><td>Balance</td></tr>`;
    let run = num(r.color);
    r.entries.slice().reverse().forEach(e => {
      run -= num(e.fitting);
      html += `<tr>${td(fdate(e.t))}${td(ftime(e.t))}${td(num(e.fitting))}${td(run)}</tr>`;
    });
    html += `<tr style="font-weight:bold"><td colspan="2">Total</td>${td(paid(r))}${td(total(r))}</tr>`;
  });
  html += `</table></body></html>`;
  const blob = new Blob(["\ufeff" + html], {type: "application/vnd.ms-excel;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (m.name + "_" + c.name).replace(/[^\w\u0900-\u097F-]+/g, "_") + ".xls";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  log(`Excel file created: ${c.name}`);
}

function renderHistory(){
  title.textContent = "History";
  app.innerHTML = `<div class="card">` + (db.history.length ?
    db.history.map(h => `<div class="hist"><time>${esc(h.t)}</time>${esc(h.text)}</div>`).join("")
    : `<div class="empty">No history yet.</div>`) + `</div>`;
}

document.addEventListener("visibilitychange", () => {
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(user && hiddenAt && Date.now() - hiddenAt > 60000 && !saving && !unsaved) resetSession();
});
